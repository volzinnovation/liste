name: Check static list app

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate package and run URL tests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node --check app.js
          npm test
